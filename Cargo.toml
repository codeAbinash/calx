[package]
name = "calx"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "cx"
path = "src/main.rs"

[dependencies]

[profile.release]
opt-level = 3       # Optimize for speed
lto = true          # Enable link-time optimization
codegen-units = 1   # Fewer codegen units for more optimization
panic = "abort"     # Abort on panic
strip = true        # Strip symbols from binary
