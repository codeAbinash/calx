name: Cargo check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  cargo-check:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check all targets
        run: cargo check --all-targets --locked
