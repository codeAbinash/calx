name: Nightly release

on:
  # 18:30 UTC is midnight IST.
  schedule:
    - cron: "30 18 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Release even when there are no new commits
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: nightly-release
  cancel-in-progress: false

jobs:
  prepare:
    name: Check for new commits
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: check
        env:
          FORCE: ${{ inputs.force }}
        run: |
          last="$(git tag --list 'nightly-*' --sort=-version:refname | head -n 1)"
          last_sha="$(git rev-parse "$last^{commit}" 2>/dev/null || true)"

          release=false
          if [[ "$FORCE" == true || "$last_sha" != "$GITHUB_SHA" ]]; then
            release=true
          fi
          echo "should_release=$release" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.asset }}
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, source: target/release/cx, asset: cx-linux-x86_64 }
          - { os: windows-latest, source: target/release/cx.exe, asset: cx-windows-x86_64.exe }
          - { os: macos-15-intel, source: target/release/cx, asset: cx-macos-x86_64 }
          - { os: ubuntu-24.04-arm, source: target/release/cx, asset: cx-linux-arm64 }
          - { os: windows-11-arm, source: target/release/cx.exe, asset: cx-windows-arm64.exe }
          - { os: macos-14, source: target/release/cx, asset: cx-macos-arm64 }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - run: cargo build --release --locked

      - name: Stage binary
        shell: bash
        run: mkdir dist && cp "${{ matrix.source }}" "dist/${{ matrix.asset }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  publish:
    name: Publish nightly release
    needs: build
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: cx-*
          path: dist
          merge-multiple: true

      - name: Create dated prerelease
        run: |
          tag="nightly-$(TZ=Asia/Kolkata date +%F)"

          # Replace today's release if this is a re-run.
          gh release delete "$tag" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$tag" dist/* \
            --target "$GITHUB_SHA" \
            --title "Nightly ${tag#nightly-}" \
            --prerelease \
            --notes "Automated build from commit $GITHUB_SHA."
